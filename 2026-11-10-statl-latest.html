/* Layout: one calm column, chart on top, one big control under it; RedZone's settings palette and spacing. */
:root {
  --bg: #f4f2ed;
  --card: #fbfaf7;
  --ink: #23271f;
  --muted: #6d7067;
  --line: #e2dfd7;
  --accent: #4c6640;
  --good: #4c6640;
  --near: #a77b2c;
  --miss: #a4513f;
  --mark: #23271f;
  --font-display: 'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 12px;
  --max-width: 560px;
  --gap: 16px;
  --tap-min: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a17;
  --card: #1e231f;
  --ink: #e9e6df;
  --muted: #9a9d94;
  --line: #2d332e;
  --accent: #a9c393;
  --good: #a9c393;
  --near: #d6a35a;
  --miss: #d58a76;
  --mark: #e9e6df;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161a17;
  --card: #1e231f;
  --ink: #e9e6df;
  --muted: #9a9d94;
  --line: #2d332e;
  --accent: #a9c393;
  --good: #a9c393;
  --near: #d6a35a;
  --miss: #d58a76;
  --mark: #e9e6df;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: var(--max-width); margin: 0 auto; padding-block: 20px 56px; display: grid; gap: var(--gap); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: italic 500 2rem/1 var(--font-display); letter-spacing: 0.01em; margin: 0; }
.brand-sub { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
#dots { display: flex; gap: 6px; }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); }
.pip-now { border-color: var(--ink); }
.pip-green { background: var(--good); border-color: var(--good); }
.pip-yellow { background: var(--near); border-color: var(--near); }
.pip-red { background: var(--miss); border-color: var(--miss); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.prompt { font: 500 1.6rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.85rem; margin: 0; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--muted); opacity: 0.45; }
.chart .bar-above { fill: var(--accent); opacity: 0.7; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font: 10px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .axis-label { fill: var(--ink); font: italic 500 14px var(--font-display); }
.chart .dot { fill: var(--ink); opacity: 0.5; }
.chart .dot-out { fill: var(--miss); opacity: 1; }
.chart .ring { fill: none; stroke: var(--miss); stroke-width: 1.5; }
.chart .dropped { opacity: 0.15; transition: opacity 400ms ease; }
.chart .guess-line { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.chart .guess-band { fill: var(--accent); opacity: 0.16; }
.chart .mean-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .threshold { stroke: var(--ink); stroke-width: 1.5; }
.chart .truth-line { stroke: var(--ink); stroke-width: 2.5; }
.readout { font: 500 2.6rem/1 var(--font-display); font-variant-numeric: lining-nums tabular-nums; text-align: center; }
input[type="range"] { width: 100%; height: var(--tap-min); margin: 0; accent-color: var(--accent); touch-action: pan-y; }
button { font: inherit; cursor: pointer; }
.primary, .option {
  min-height: var(--tap-min); padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; font-size: 1rem;
}
.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.option { text-align: left; }
.option:hover, .primary:hover { filter: brightness(1.05); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reveal { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.band { display: inline-block; justify-self: start; padding: 2px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; border: 1px solid currentColor; }
.band-green { color: var(--good); }
.band-yellow { color: var(--near); }
.band-red { color: var(--miss); }
.answer { margin: 0; font-variant-numeric: tabular-nums; }
.why { margin: 0; font: italic 1.15rem/1.35 var(--font-display); }
.clue { margin: 0; color: var(--muted); font-size: 0.9rem; }
.clue b { color: var(--ink); font-weight: 600; }
.options { display: grid; gap: 8px; }
.ds-title { font: italic 500 2rem/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.ds-blurb { margin: 0; max-width: 62ch; }
.small { color: var(--muted); font-size: 0.85rem; margin: 0; }
a { color: var(--accent); }
.vars { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 0.9rem; }
.vars b { font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat-num { font: 500 2.2rem/1 var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
.stat-label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
.grid { font-size: 1.6rem; letter-spacing: 0.1em; text-align: center; margin: 0; }

// ---- stats.js ----
// Plain statistics, shared by the build (answers) and the browser (nothing is recomputed there, but it keeps one source).

const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const mean = (xs) => sum(xs) / xs.length;

function median(xs) {
  const s = [...xs].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Sample standard deviation (n - 1).
function sd(xs) {
  const m = mean(xs);
  return Math.sqrt(sum(xs.map((x) => (x - m) ** 2)) / (xs.length - 1));
}

function pearson(xs, ys) {
  const mx = mean(xs);
  const my = mean(ys);
  let sxy = 0;
  let sxx = 0;
  let syy = 0;
  for (let i = 0; i < xs.length; i++) {
    const dx = xs[i] - mx;
    const dy = ys[i] - my;
    sxy += dx * dy;
    sxx += dx * dx;
    syy += dy * dy;
  }
  return sxy / Math.sqrt(sxx * syy);
}

const share_above = (xs, t) => xs.filter((x) => x > t).length / xs.length;

function quantile(xs, q) {
  const s = [...xs].sort((a, b) => a - b);
  const pos = (s.length - 1) * q;
  const lo = Math.floor(pos);
  const hi = Math.ceil(pos);
  return s[lo] + (s[hi] - s[lo]) * (pos - lo);
}

const extent = (xs) => [Math.min(...xs), Math.max(...xs)];

// Round to a "nice" number of significant figures, for thresholds people can read.
function nice(x, sig = 2) {
  if (x === 0) return 0;
  const p = 10 ** (Math.floor(Math.log10(Math.abs(x))) - sig + 1);
  return Math.round(x / p) * p;
}

// Deterministic PRNG (mulberry32) seeded from a string (FNV-1a hash).
function hash_string(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

function rng(seed) {
  let a = typeof seed === 'string' ? hash_string(seed) : seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(xs, rand) {
  const a = [...xs];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---- rounds.js ----
// Round types: a generator (build time, writes every answer into puzzles.json), an error function and an input range
// (browser). config.js wires these to bands, weights and copy; nothing here hard-codes a setting.

const EPS = 1e-9; // float slack so a guess exactly on a band edge lands in that band

// Indices of rows where every named column is a finite number, thinned by an even stride to at most `max`.
function pick_rows(table, cols, max) {
  const ok = [];
  for (let i = 0; i < table.n; i++) if (cols.every((c) => Number.isFinite(table.columns[c][i]))) ok.push(i);
  if (ok.length <= max) return ok;
  return Array.from({ length: max }, (_, k) => ok[Math.floor((k * ok.length) / max)]);
}

const values = (table, col, rows) => rows.map((i) => table.columns[col][i]);
const r3 = (x) => Math.round(x * 1000) / 1000;
const fmt = (x) => (Math.abs(x) >= 100 ? Math.round(x).toLocaleString('en-US') : String(r3(x)));

// ---- generators: (table, column list for this round, settings) -> instances ----

function gen_center(table, cols, s) {
  const out = [];
  for (const col of cols) {
    const rows = pick_rows(table, [col], s.max_points);
    const x = values(table, col, rows);
    const [lo, hi] = extent(x);
    const mu = mean(x);
    const md = median(x);
    const skew = (mu - md) / (sd(x) || 1);
    for (const stat of s.center_stats) {
      const answer = stat === 'mean' ? mu : md;
      let why;
      if (Math.abs(skew) >= s.skew_threshold) {
        why = stat === 'mean'
          ? `The long ${skew > 0 ? 'right' : 'left'} tail pulls the mean (${fmt(mu)}) away from the median (${fmt(md)}).`
          : `Skew pulls the mean (${fmt(mu)}), not the median (${fmt(md)}): the median only cares about the middle value.`;
      } else {
        why = `Nearly symmetric, so the mean (${fmt(mu)}) and median (${fmt(md)}) sit close together.`;
      }
      out.push({ cols: [col], rows, x, stat, answer, lo, hi, why });
    }
  }
  return out;
}

function gen_spread(table, cols, s) {
  return cols.map((col) => {
    const rows = pick_rows(table, [col], s.max_points);
    const x = values(table, col, rows);
    const [lo, hi] = extent(x);
    const answer = sd(x);
    const mu = mean(x);
    const within = x.filter((v) => Math.abs(v - mu) <= answer).length / x.length;
    const why = `About ${Math.round(within * 100)}% of the rows sit within one standard deviation (${fmt(answer)}) of the mean.`;
    return { cols: [col], rows, x, answer, lo, hi, mean: mu, why };
  });
}

function r_words(r) {
  const a = Math.abs(r);
  const dir = r > 0 ? 'rising' : 'falling';
  if (a >= 0.8) return `The points hug a ${dir} line, so r is strong.`;
  if (a >= 0.4) return `A ${dir} trend with plenty of scatter around it: a moderate r.`;
  if (a >= 0.15) return `Only a faint ${dir} tilt; most of the scatter is noise.`;
  return 'No straight-line trend, so r sits near zero (a curve or clusters can still hide in there).';
}

function gen_correlation(table, pairs, s) {
  return pairs.map(([a, b]) => {
    const rows = pick_rows(table, [a, b], s.max_points);
    const x = values(table, a, rows);
    const y = values(table, b, rows);
    const answer = pearson(x, y);
    return { cols: [a, b], rows, x, y, answer, why: r_words(answer) };
  });
}

function gen_outlier_swing(table, pairs, s) {
  return pairs.map(([a, b]) => {
    const rows = pick_rows(table, [a, b], s.outlier_points);
    const x = values(table, a, rows);
    const y = values(table, b, rows);
    const r_all = pearson(x, y);
    let best = 0;
    let best_r = r_all;
    for (let i = 0; i < x.length; i++) {
      const r = pearson(x.filter((_, k) => k !== i), y.filter((_, k) => k !== i));
      if (Math.abs(r - r_all) > Math.abs(best_r - r_all)) {
        best = i;
        best_r = r;
      }
    }
    const swing = best_r - r_all;
    const why = Math.abs(swing) >= s.swing_threshold
      ? `One point out of ${x.length} moves r by ${swing > 0 ? '+' : ''}${r3(swing)}: correlation is not robust to outliers.`
      : `Among ${x.length} points even the most extreme one moves r by only ${swing > 0 ? '+' : ''}${r3(swing)}.`;
    return { cols: [a, b], rows, x, y, r_all, outlier: best, answer: best_r, swing, why };
  });
}

function gen_share(table, cols, s) {
  const out = [];
  for (const col of cols) {
    const rows = pick_rows(table, [col], s.max_points);
    const x = values(table, col, rows);
    const [lo, hi] = extent(x);
    for (const q of s.share_quantiles) {
      const threshold = nice(quantile(x, q), s.threshold_sig_figs);
      if (!(threshold > lo && threshold < hi)) continue;
      const answer = share_above(x, threshold);
      const above = Math.round(answer * x.length);
      out.push({
        cols: [col], rows, x, lo, hi, threshold, answer,
        why: `${above} of ${x.length} rows sit above ${fmt(threshold)}: count over the line, divide by the total.`,
      });
    }
  }
  return out;
}

// ---- errors: (guess, instance) -> a non-negative number compared with the bands ----

const error_relative_range = (g, inst) => Math.abs(g - inst.answer) / (inst.hi - inst.lo);
const error_relative = (g, inst) => Math.abs(g - inst.answer) / Math.abs(inst.answer);
const error_absolute = (g, inst) => Math.abs(g - inst.answer);

// ---- input ranges: instance -> the slider the player gets ----

const input_data_range = (inst) => ({ min: inst.lo, max: inst.hi, step: (inst.hi - inst.lo) / 200, start: (inst.lo + inst.hi) / 2 });
const input_spread = (inst) => {
  const max = (inst.hi - inst.lo) / 2;
  return { min: 0, max, step: max / 200, start: max / 2 };
};
const input_r = () => ({ min: -1, max: 1, step: 0.01, start: 0 });
const input_share = () => ({ min: 0, max: 1, step: 0.01, start: 0.5, percent: true });

// Band for an error. Bands are ordered tightest first; anything past the last is the miss band.
function band_for(error, bands, miss) {
  for (const b of bands) if (error <= b.max + EPS) return b;
  return miss;
}

// ---- daily.js ----
// Turn a date into the day's puzzle. Everyone gets the same one: it is seeded only by the date in ET and the salt.


// Calendar day (YYYY-MM-DD) in the game's time zone.
function day_in(time_zone, now = new Date()) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: time_zone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
}

const to_utc = (day) => Date.parse(`${day}T00:00:00Z`);
const day_number = (day, epoch) => Math.round((to_utc(day) - to_utc(epoch)) / 864e5);
const add_days = (day, n) => new Date(to_utc(day) + n * 864e5).toISOString().slice(0, 10);

// Dataset for every day from the epoch up to `day`: each day picks at random (seeded by its date) among datasets not
// used in the previous `no_repeat_days` days. A date before the epoch (a wrong device clock) gets the epoch's puzzle.
const memo = new Map();
function schedule(day, game, allowlist) {
  if (allowlist.length <= game.no_repeat_days) {
    throw new Error(`need more than ${game.no_repeat_days} datasets for the no-repeat rule; have ${allowlist.length}`);
  }
  const n = Math.max(0, day_number(day, game.epoch));
  const key = `${game.seed_salt}|${game.epoch}|${game.no_repeat_days}|${allowlist.join(',')}`;
  let seq = memo.get(key);
  if (!seq) memo.set(key, (seq = []));
  for (let i = seq.length; i <= n; i++) {
    const recent = new Set(seq.slice(Math.max(0, i - game.no_repeat_days), i));
    const open = allowlist.filter((id) => !recent.has(id));
    const d = add_days(game.epoch, i);
    seq.push(open[Math.floor(rng(`${game.seed_salt}|${d}|dataset`)() * open.length)]);
  }
  return seq[n];
}

// Assemble a playable puzzle for `day` from puzzles.json and the config.
function puzzle_for(day, puzzles, cfg) {
  const { game, round_types } = cfg;
  const id = schedule(day, game, cfg.allowlist);
  const ds = puzzles.datasets[id];
  if (!ds) throw new Error(`dataset ${id} is missing from puzzles.json`);
  const letters = new Map();
  const name_of = (col) => {
    if (!letters.has(col)) letters.set(col, game.variable_names[letters.size] ?? `Variable ${letters.size + 1}`);
    return letters.get(col);
  };
  const clue_keys = game.hint_sequence.filter((k) => ds.clues[k]);
  const rounds = [];
  for (let i = 0; i < game.rounds_per_day; i++) {
    const type = game.round_sequence[i % game.round_sequence.length];
    const pool = ds.rounds[type];
    const pick = pool[Math.floor(rng(`${game.seed_salt}|${day}|${type}|${i}`)() * pool.length)];
    const s = ds.series[pick.series];
    const inst = { ...pick, cols: s.cols, x: s.x, y: s.y };
    const vars = s.cols.map(name_of);
    rounds.push({
      type,
      inst,
      vars,
      prompt: round_types[type].prompt(inst, vars),
      clue: clue_keys[i] ? ds.clues[clue_keys[i]] : null,
    });
  }
  let bonus = null;
  if (game.bonus_enabled) {
    const r = rng(`${game.seed_salt}|${day}|bonus`);
    const others = shuffle(cfg.allowlist.filter((k) => k !== id), r).slice(0, game.bonus_options - 1);
    bonus = { answer: id, options: shuffle([id, ...others], r).map((k) => ({ id: k, title: puzzles.datasets[k].title })) };
  }
  const variables = [...letters].map(([col, name]) => ({ name, label: ds.labels?.[col] ?? col }));
  return { day, id, dataset: ds, rounds, bonus, variables };
}

// Score one guess. Returns the error, the band, its emoji and points × the round's weight.
function score_guess(type, guess, inst, cfg) {
  const rt = cfg.round_types[type];
  const error = rt.error(guess, inst);
  const b = band_for(error, rt.bands, cfg.miss_band);
  return { error, band: b.band, emoji: b.emoji, points: b.points * rt.weight, max: rt.bands[0].points * rt.weight };
}

function share_text(day, results, bonus_right, cfg) {
  const total = results.reduce((a, r) => a + r.points, 0);
  const max = results.reduce((a, r) => a + r.max, 0);
  const grid = results.map((r) => r.emoji).join('');
  const lines = [`${cfg.game.name} ${day}  ${total}/${max}`, grid];
  if (bonus_right !== null && bonus_right !== undefined) lines[1] += bonus_right ? ' 🎯' : ' ✖️';
  if (cfg.game.share_url) lines.push(cfg.game.share_url);
  return lines.join('\n');
}

// Streak = consecutive finished days ending today (or yesterday, if today isn't played yet).
function streak(history, today) {
  let day = history[today] ? today : add_days(today, -1);
  let n = 0;
  while (history[day]) {
    n++;
    day = add_days(day, -1);
  }
  return n;
}

// ---- game.js ----
// Browser UI. Reads PUZZLES (inlined by the build) and config; draws charts with plain SVG.


const cfg = config;
const $ = (sel) => document.querySelector(sel);
const NS = 'http://www.w3.org/2000/svg';

// ---- storage (visitor's own browser only; every access guarded) ----
function load_store() {
  try {
    const raw = localStorage.getItem(cfg.game.storage_key);
    const s = raw ? JSON.parse(raw) : {};
    return { history: s.history ?? {}, progress: s.progress ?? null };
  } catch {
    return { history: {}, progress: null };
  }
}
function save_store(s) {
  try {
    localStorage.setItem(cfg.game.storage_key, JSON.stringify(s));
  } catch {
    /* private mode or blocked storage: the game still plays, it just won't remember */
  }
}

// ---- number formatting ----
function fmt_num(v, span) {
  const a = Math.abs(span ?? v);
  const digits = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: digits, useGrouping: Math.abs(v) >= 10000 });
}
const fmt_guess = (v, input) => (input.percent ? `${Math.round(v * 100)}%` : fmt_num(v, input.max - input.min));

// ---- SVG charts ----
const W = 340;
const H = 210;
const PAD = { l: 14, r: 14, t: 14, b: 40 };
function el(name, attrs = {}, parent) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
function svg_root() {
  return el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', class: 'chart' });
}
const scale = (d0, d1, r0, r1) => (v) => (d1 === d0 ? (r0 + r1) / 2 : r0 + ((v - d0) / (d1 - d0)) * (r1 - r0));

function axis_x(svg, sx, lo, hi, label) {
  const y = H - PAD.b;
  el('line', { x1: PAD.l, x2: W - PAD.r, y1: y, y2: y, class: 'axis' }, svg);
  for (const [v, anchor] of [[lo, 'start'], [(lo + hi) / 2, 'middle'], [hi, 'end']]) {
    el('line', { x1: sx(v), x2: sx(v), y1: y, y2: y + 4, class: 'axis' }, svg);
    el('text', { x: sx(v), y: y + 16, 'text-anchor': anchor, class: 'tick' }, svg).textContent = fmt_num(v, hi - lo);
  }
  el('text', { x: W / 2, y: H - 4, 'text-anchor': 'middle', class: 'axis-label' }, svg).textContent = label;
}

function histogram(round) {
  const { inst, vars, type } = round;
  const svg = svg_root();
  const lo = inst.lo;
  const hi = inst.hi;
  const sx = scale(lo, hi, PAD.l, W - PAD.r);
  const nb = Math.min(28, Math.max(8, Math.round(Math.sqrt(inst.x.length) * 1.5)));
  const counts = new Array(nb).fill(0);
  for (const v of inst.x) counts[Math.min(nb - 1, Math.floor(((v - lo) / (hi - lo || 1)) * nb))]++;
  const sy = scale(0, Math.max(...counts), H - PAD.b, PAD.t + 8);
  const bw = (W - PAD.l - PAD.r) / nb;
  counts.forEach((c, i) => {
    const left = lo + (i / nb) * (hi - lo);
    const above = type === 'share' && left >= inst.threshold;
    el('rect', { x: PAD.l + i * bw + 0.5, y: sy(c), width: Math.max(0.5, bw - 1), height: H - PAD.b - sy(c), class: above ? 'bar bar-above' : 'bar' }, svg);
  });
  axis_x(svg, sx, lo, hi, vars[0]);
  const marks = el('g', {}, svg);
  if (type === 'share') {
    el('line', { x1: sx(inst.threshold), x2: sx(inst.threshold), y1: PAD.t, y2: H - PAD.b, class: 'threshold' }, marks);
    el('text', { x: sx(inst.threshold) + 4, y: PAD.t + 6, class: 'tick' }, marks).textContent = fmt_num(inst.threshold, hi - lo);
  }
  const guess = el('g', { class: 'guess' }, svg);
  const truth = el('g', { class: 'truth' }, svg);
  return {
    svg,
    show_guess(g) {
      guess.replaceChildren();
      if (type === 'center') el('line', { x1: sx(g), x2: sx(g), y1: PAD.t, y2: H - PAD.b, class: 'guess-line' }, guess);
      if (type === 'spread') {
        const m = inst.mean;
        el('rect', { x: sx(Math.max(lo, m - g)), y: PAD.t, width: Math.max(0, sx(Math.min(hi, m + g)) - sx(Math.max(lo, m - g))), height: H - PAD.b - PAD.t, class: 'guess-band' }, guess);
        el('line', { x1: sx(m), x2: sx(m), y1: PAD.t, y2: H - PAD.b, class: 'mean-line' }, guess);
      }
    },
    show_truth() {
      const t = inst.answer;
      if (type === 'center') el('line', { x1: sx(t), x2: sx(t), y1: PAD.t, y2: H - PAD.b, class: 'truth-line' }, truth);
      if (type === 'spread') {
        for (const v of [inst.mean - t, inst.mean + t]) if (v >= lo && v <= hi) el('line', { x1: sx(v), x2: sx(v), y1: PAD.t, y2: H - PAD.b, class: 'truth-line' }, truth);
      }
    },
  };
}

function scatter(round) {
  const { inst, vars, type } = round;
  const svg = svg_root();
  const pad = { ...PAD, l: 30 };
  const xs = inst.x;
  const ys = inst.y;
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  const [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  const sx = scale(x0, x1, pad.l + 6, W - pad.r - 6);
  const sy = scale(y0, y1, H - pad.b - 6, pad.t + 6);
  el('line', { x1: pad.l, x2: pad.l, y1: pad.t, y2: H - pad.b, class: 'axis' }, svg);
  el('text', { x: 4, y: pad.t + 4, class: 'tick' }, svg).textContent = fmt_num(y1, y1 - y0);
  el('text', { x: 4, y: H - pad.b, class: 'tick' }, svg).textContent = fmt_num(y0, y1 - y0);
  el('text', { x: 12, y: (H - pad.b + pad.t) / 2, class: 'axis-label', transform: `rotate(-90 12 ${(H - pad.b + pad.t) / 2})`, 'text-anchor': 'middle' }, svg).textContent = vars[1];
  const y = H - pad.b;
  el('line', { x1: pad.l, x2: W - pad.r, y1: y, y2: y, class: 'axis' }, svg);
  el('text', { x: sx(x0), y: y + 16, class: 'tick', 'text-anchor': 'start' }, svg).textContent = fmt_num(x0, x1 - x0);
  el('text', { x: sx(x1), y: y + 16, class: 'tick', 'text-anchor': 'end' }, svg).textContent = fmt_num(x1, x1 - x0);
  el('text', { x: (W + pad.l) / 2, y: H - 4, 'text-anchor': 'middle', class: 'axis-label' }, svg).textContent = vars[0];
  const dots = el('g', {}, svg);
  let ring = null;
  xs.forEach((xv, i) => {
    const out = type === 'outlier_swing' && i === inst.outlier;
    const c = el('circle', { cx: sx(xv), cy: sy(ys[i]), r: out ? 3.5 : 2.6, class: out ? 'dot dot-out' : 'dot' }, dots);
    if (out) ring = { c, halo: el('circle', { cx: sx(xv), cy: sy(ys[i]), r: 8, class: 'ring' }, svg) };
  });
  return {
    svg,
    show_guess() {},
    show_truth() {
      if (ring) {
        ring.c.classList.add('dropped');
        ring.halo.classList.add('dropped');
      }
    },
  };
}

// ---- screens ----
const store = load_store();
const today = day_in(cfg.game.time_zone);
let puzzle;
try {
  // eslint-disable-next-line no-undef
  puzzle = puzzle_for(today, PUZZLES, cfg);
} catch (e) {
  $('#app').textContent = `Today's puzzle could not be built: ${e.message}`;
  throw e;
}
let progress = store.progress?.day === today ? store.progress : { day: today, guesses: [], bonus: null };
const persist = () => {
  store.progress = progress;
  save_store(store);
};

function results() {
  return progress.guesses.map((g, i) => score_guess(puzzle.rounds[i].type, g, puzzle.rounds[i].inst, cfg));
}

function header() {
  $('#day').textContent = new Date(`${today}T12:00:00Z`).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const dots = $('#dots');
  dots.replaceChildren();
  const res = results();
  puzzle.rounds.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = `pip ${res[i] ? `pip-${res[i].band}` : i === progress.guesses.length ? 'pip-now' : ''}`;
    dots.appendChild(d);
  });
}

function show_round(i, revealed = false) {
  header();
  const round = puzzle.rounds[i];
  const rt = cfg.round_types[round.type];
  const input = rt.input(round.inst);
  const main = $('#app');
  main.replaceChildren();
  const tpl = $('#tpl-round').content.cloneNode(true);
  tpl.querySelector('.eyebrow').textContent = `Round ${i + 1} of ${puzzle.rounds.length} · ${rt.label}`;
  tpl.querySelector('.prompt').textContent = round.prompt;
  tpl.querySelector('.meta').textContent = `${round.inst.x.length} points shown`;
  const chart = rt.chart === 'scatter' ? scatter(round) : histogram(round);
  tpl.querySelector('.chart-box').appendChild(chart.svg);
  const slider = tpl.querySelector('#guess');
  const readout = tpl.querySelector('.readout');
  slider.min = input.min;
  slider.max = input.max;
  slider.step = input.step;
  slider.value = revealed ? progress.guesses[i] : input.start;
  const update = () => {
    const g = Number(slider.value);
    readout.textContent = fmt_guess(g, input);
    chart.show_guess(g);
  };
  slider.addEventListener('input', update);
  update();
  const lock = tpl.querySelector('#lock');
  const reveal = tpl.querySelector('.reveal');
  main.appendChild(tpl);

  const do_reveal = () => {
    const g = progress.guesses[i];
    const r = score_guess(round.type, g, round.inst, cfg);
    slider.disabled = true;
    lock.hidden = true;
    chart.show_truth();
    reveal.hidden = false;
    reveal.querySelector('.band').textContent = `${r.emoji} ${r.points} pts`;
    reveal.querySelector('.band').className = `band band-${r.band}`;
    reveal.querySelector('.answer').textContent = `Answer ${fmt_guess(round.inst.answer, input)} · you said ${fmt_guess(g, input)}`;
    reveal.querySelector('.why').textContent = round.inst.why;
    const clue = reveal.querySelector('.clue');
    clue.hidden = !round.clue;
    clue.querySelector('span').textContent = round.clue ?? '';
    const next = reveal.querySelector('#next');
    const last = i === puzzle.rounds.length - 1;
    next.textContent = last ? (puzzle.bonus ? 'One last guess' : 'See the reveal') : 'Next round';
    next.onclick = () => (last ? (puzzle.bonus ? show_bonus() : show_end()) : show_round(i + 1));
    next.focus();
    header();
  };
  lock.onclick = () => {
    progress.guesses[i] = Number(slider.value);
    persist();
    do_reveal();
  };
  if (revealed) do_reveal();
}

function show_bonus() {
  header();
  const main = $('#app');
  main.replaceChildren();
  const tpl = $('#tpl-bonus').content.cloneNode(true);
  const list = tpl.querySelector('.options');
  for (const opt of puzzle.bonus.options) {
    const b = document.createElement('button');
    b.className = 'option';
    b.type = 'button';
    b.textContent = opt.title;
    b.onclick = () => {
      progress.bonus = opt.id;
      persist();
      show_end();
    };
    list.appendChild(b);
  }
  main.appendChild(tpl);
}

function show_end() {
  const res = results();
  const bonus_right = puzzle.bonus ? progress.bonus === puzzle.bonus.answer : null;
  const total = res.reduce((a, r) => a + r.points, 0);
  const max = res.reduce((a, r) => a + r.max, 0);
  if (res.length === puzzle.rounds.length) {
    store.history[today] = { score: total, max, grid: res.map((r) => r.emoji).join(''), bonus: bonus_right };
    persist();
  }
  header();
  const ds = puzzle.dataset;
  const main = $('#app');
  main.replaceChildren();
  const tpl = $('#tpl-end').content.cloneNode(true);
  tpl.querySelector('.ds-title').textContent = ds.title;
  tpl.querySelector('.ds-blurb').textContent = ds.blurb;
  const src = tpl.querySelector('.ds-source');
  src.href = ds.source.url;
  src.textContent = ds.source.title;
  const lic = tpl.querySelector('.ds-license');
  lic.href = ds.license.url;
  lic.textContent = ds.license.name;
  const vars = tpl.querySelector('.vars');
  for (const v of puzzle.variables) {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = v.name;
    li.append(b, ` ${v.label}`);
    vars.appendChild(li);
  }
  if (puzzle.bonus) {
    const picked = puzzle.bonus.options.find((o) => o.id === progress.bonus);
    tpl.querySelector('.bonus-line').textContent = bonus_right ? '🎯 You named the data.' : `You guessed ${picked ? picked.title : 'nothing'}.`;
  }
  tpl.querySelector('.score').textContent = `${total}`;
  tpl.querySelector('.score-max').textContent = `of ${max}`;
  tpl.querySelector('.grid').textContent = res.map((r) => r.emoji).join(' ');
  const played = Object.keys(store.history).length;
  tpl.querySelector('.streak').textContent = `${streak(store.history, today)}`;
  tpl.querySelector('.played').textContent = `${played}`;
  const text = share_text(today, res, bonus_right, cfg);
  tpl.querySelector('.share-text').textContent = text;
  const btn = tpl.querySelector('#share');
  btn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied';
    } catch {
      const pre = document.querySelector('.share-text');
      pre.hidden = false;
      const range = document.createRange();
      range.selectNodeContents(pre);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      btn.textContent = 'Selected: copy it';
    }
  };
  main.appendChild(tpl);
}

// Resume where the visitor left off today.
function start() {
  const n = progress.guesses.length;
  if (store.history[today] || (n >= puzzle.rounds.length && (!puzzle.bonus || progress.bonus))) show_end();
  else if (n >= puzzle.rounds.length) show_bonus();
  else if (n > 0) show_round(n - 1, true);
  else show_round(0);
}
start();

</script>
