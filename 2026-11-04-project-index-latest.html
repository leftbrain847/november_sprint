<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a sticky console header (status + tabs) over one scrolling view; cards stack to one column on phones. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#15181d; --muted:#5e6672; --line:#dde1e7; --accent:#2457c5;
  --crit:#c2261b; --high:#d0660b; --med:#b38b00; --low:#8b939e; --good:#1d7f4b;
  --sunk:#eceef2; --chip:#e7ebf2;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --ink:#e8ebef; --muted:#9aa3ae; --line:#2a3038; --accent:#7aa2ff;
  --crit:#ff6b5e; --high:#ff9a45; --med:#e7c14b; --low:#7d8691; --good:#4cc38a; --sunk:#12161b; --chip:#222833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --ink:#e8ebef; --muted:#9aa3ae; --line:#2a3038; --accent:#7aa2ff;
  --crit:#ff6b5e; --high:#ff9a45; --med:#e7c14b; --low:#7d8691; --good:#4cc38a; --sunk:#12161b; --chip:#222833; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px}
a{color:var(--accent)}
.mono,code{font-family:var(--font-mono);font-size:12.5px}
code{background:var(--chip);padding:1px 5px;border-radius:5px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.headrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.asof{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.mode{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.mode.live{color:var(--good)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--font-body);cursor:pointer}
nav button .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button[aria-selected="true"] .n{color:var(--bg);opacity:.75}
main{max-width:880px;margin:0 auto;padding:6px 16px 80px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;display:grid;gap:2px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:15px}
.tile.alert .v{color:var(--crit)}
svg.spark{width:100%;height:26px;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.card>.top{display:grid;grid-template-columns:4px 1fr;gap:0}
.stripe{background:var(--low)}
.stripe.critical{background:var(--crit)}.stripe.high{background:var(--high)}.stripe.medium{background:var(--med)}.stripe.low{background:var(--low)}
.body{padding:12px 12px 10px;display:grid;gap:6px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.why{font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.over{background:var(--crit);color:#fff}
.pill.pending{outline:1px dashed var(--accent);background:transparent;color:var(--accent)}
.pill.pass{color:var(--good)}.pill.warn{color:var(--med)}.pill.fail{color:var(--crit)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--low)}
.dot.critical{background:var(--crit)}.dot.high{background:var(--high)}.dot.medium{background:var(--med)}.dot.low{background:var(--low)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--font-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details>summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";font-size:11px}
details[open]>summary::before{content:"▾"}
.items{display:grid;gap:0;border-top:1px solid var(--line)}
.item{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font:12.5px/1.45 var(--font-mono);margin:0;max-height:260px;overflow:auto}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.controls input{grid-column:1/-1}
input,select,textarea{min-height:44px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--font-body)}
textarea{min-height:64px;resize:vertical}
.count{color:var(--muted);font-size:12.5px;margin:6px 0}
.grid2{display:grid;gap:8px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;text-decoration:none;color:inherit;min-height:44px}
.area .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.area .v{font-weight:600}
.dist{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.dist span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.repo>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.repo{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.grade{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--chip)}
.grade.A{color:var(--good)}.grade.B{color:var(--accent)}.grade.C{color:var(--med)}.grade.D{color:var(--high)}.grade.F{color:var(--crit)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--font-body);font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative;cursor:default}
.cal button.has{cursor:pointer;color:#fff;border-color:transparent}
.cal button.pass{background:var(--good)}.cal button.warn{background:var(--med)}.cal button.fail{background:var(--crit)}.cal button.built{background:var(--chip);color:var(--ink)}
.cal button.today{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.answer{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.miss{border-left:3px solid var(--crit);padding-left:10px}
.empty{color:var(--muted);padding:16px 0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
table.plain{border-collapse:collapse;font-size:13.5px;width:100%}
table.plain td,table.plain th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.wrapx{overflow-x:auto}
</style>
</head>

/* ---------- ranking and status ---------- */
const catIdx = c => Math.max(0, (S.category_order || []).indexOf(c));
function rankKey(f) {
  const sev = -SEV[f.severity], cat = catIdx(f.category), over = f.overdue ? 0 : 1;
  return S.rank_by === "category" ? [cat, sev, over, f.repo] : [sev, over, cat, f.repo];
}
const cmp = (a, b) => { const x = rankKey(a), y = rankKey(b); for (let i = 0; i < x.length; i++) { if (x[i] < y[i]) return -1; if (x[i] > y[i]) return 1; } return 0; };
function local(f) { const d = state.dec[f.code]; if (!d || d.synced) return null; if (d.action === "snooze" && d.until && d.until <= TODAY) return null; return d; }
function eff(f) { const l = local(f); return l ? "pending-" + l.action : f.status; }
const isOpen = f => eff(f) === "open";
const inQueue = f => f.in_queue && isOpen(f);
const queue = () => D.findings.filter(inQueue).sort(cmp);
const review = () => D.findings.filter(f => f.status === "approved");
const pending = () => D.findings.filter(f => local(f));
const lostWork = () => D.findings.filter(f => f.category === "lost-work" && f.check !== "todo-debt" && (isOpen(f) || f.status === "approved")).sort(cmp);
const cleanup = () => D.findings.filter(f => f.category === "reuse" && isOpen(f)).sort(cmp);
function groups(list) { const m = new Map(); for (const f of list.slice().sort(cmp)) { if (!m.has(f.check)) m.set(f.check, []); m.get(f.check).push(f); } return [...m.entries()]; }
function dueText(fs) {
  const q = fs.filter(f => f.due_in !== null && f.due_in !== undefined); if (!q.length) return "";
  const worst = Math.min(...q.map(f => +f.due_in)), oldest = Math.max(...fs.map(f => +f.age || 0));
  return (worst < 0 ? `overdue ${-worst}d` : `due in ${worst}d`) + ` · open ${oldest}d`;
}

/* ---------- charts ---------- */
function spark(key, better = "down") {
  const pts = D.metrics.map(r => +r[key]).filter(v => !isNaN(v)).slice(-14);
  const W = 100, H = 26, pad = 3;
  if (pts.length < 2) return {svg: `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="${H - pad}" x2="${W}" y2="${H - pad}" stroke="var(--line)" stroke-width="1"/><circle cx="${W - pad}" cy="${H - pad}" r="2.5" fill="var(--accent)"/></svg>`, delta: "trend from day 2"};
  const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
  const xy = pts.map((v, i) => [pad + i * (W - 2 * pad) / (pts.length - 1), H - pad - (v - lo) / span * (H - 2 * pad)]);
  const line = xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const area = `${pad},${H} ${line} ${W - pad},${H}`;
  const d = pts[pts.length - 1] - pts[0], good = better === "down" ? d < 0 : d > 0;
  const color = d === 0 ? "var(--muted)" : good ? "var(--good)" : "var(--high)";
  const [ex, ey] = xy[xy.length - 1];
  return {svg: `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="${area}" fill="${color}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.5" fill="${color}"/></svg>`,
    delta: `${d > 0 ? "+" : ""}${+d.toFixed(1)} over ${pts.length} days`};
}

/* ---------- decisions (db) ---------- */
async function decide(fs, action) {
  if (D.demo) {
    for (const f of fs) state.dec[f.code] = {action, finding: f.id, repo: f.repo, check: f.check, at: new Date().toISOString()};
    toast(`Demo: ${action === "approve" ? "approved" : action === "dismiss" ? "dismissed" : "snoozed"} ${fs.length}. Saved in this tab only.`); render(); return;
  }
  if (!state.db || !state.canWrite) { toast("Read-only here. Open the artifact in the Claude app to decide."); return; }
  const until = action === "snooze" ? new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10) : null;
  let n = 0;
  for (const f of fs) {
    try {
      await state.db.doc("decisions/" + f.code).set({action, until, finding: f.id, repo: f.repo, check: f.check, at: new Date().toISOString(), synced: false});
      n++;
    } catch (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; setMode(); }
      toast("Couldn't save: " + (e && e.code || "error")); break;
    }
  }
  if (n) toast(`${action === "approve" ? "Approved" : action === "dismiss" ? "Dismissed" : "Snoozed 7 days"}: ${n} · Claude picks this up next session`);
}
async function undo(code) { if (D.demo) { delete state.dec[code]; toast("Demo: undone"); render(); return; } if (!state.db) return; try { await state.db.doc("decisions/" + code).delete(); toast("Undone"); } catch (e) { toast("Couldn't undo"); } }
async function saveUat(name, verdict) {
  if (D.demo) { state.uat[name.replace(/[^A-Za-z0-9_\-.]+/g, "_")] = {name, verdict, at: new Date().toISOString()}; toast(`Demo: UAT ${verdict}, this tab only`); render(); return; }
  if (!state.db || !state.canWrite) { toast("Read-only here."); return; }
  const id = name.replace(/[^A-Za-z0-9_\-.]+/g, "_");
  const note = ($(`[data-note="${CSS.escape(id)}"]`) || {}).value || "";
  try { await state.db.doc("uat/" + id).set({name, verdict, note, at: new Date().toISOString()}); toast(`UAT ${verdict} saved`); }
  catch (e) { toast("Couldn't save: " + (e && e.code || "error")); }
}

async function ask(key, prompt) {
  if (D.demo) { state.answers[key] = "In the real Command Center, Claude answers here, using the finding and its repo. This demo has no Claude attached."; paintAnswer(key); return; }
  if (!state.sample) { toast("Ask Claude isn't available in this view."); return; }
  state.answers[key] = "Thinking…"; paintAnswer(key);
  try {
    const r = await state.sample(prompt, {modelTier: "quick", onText: ({text}) => { state.answers[key] = text; paintAnswer(key); }});
    state.answers[key] = r.text; paintAnswer(key);
  } catch (e) { state.answers[key] = e && e.code === "rate_limited" ? "Busy right now. Try again in a minute." : "Couldn't get an answer here."; paintAnswer(key); }
}

function groupPrompt(kind, check, fs) {

  const head = `You advise a solo developer reviewing findings from an automated code-health check. Be concrete and brief (under 120 words), plain text, no headings.\nFinding: ${f0.title} [${f0.severity}, ${f0.category}]\nWhy it matters: ${f0.why}\nRepos affected:\n${list}\nFix prompt that would be run: ${f0.prompt}\n`;
  return kind === "size" ? head + "\nEstimate the effort per repo (minutes) and total, name the riskiest repo, and say whether to batch it."
    : head + "\nExplain what the fix PR will change and what a reviewer should check before merging.";
}
function twentyPrompt() {
  const q = groups(queue()).slice(0, 8).map(([c, fs]) => `- ${fs[0].title} · ${fs.length} repo(s) [${fs[0].severity}] · ${dueText(fs)} · repos: ${fs.map(f => f.repo).join(", ")}`).join("\n");
  return `You help a solo developer pick work. They have 20 minutes. Their priority: severity first, then ${(S.category_order || []).join(" > ")}; overdue first. Queue:\n${q}\n\nPick 1-2 items that fit in 20 minutes with the most risk reduced. Say why in two sentences and give the exact phrase to tell Claude (e.g. "approve no-ci"). Plain text, under 90 words.`;
}

}
function groupCard(check, fs, open = false) {
  const f0 = fs[0], over = fs.some(f => f.overdue), due = dueText(fs.filter(f => f.in_queue));

  const m = $("#mode");
  if (D.demo) { m.textContent = "demo · sample data"; return; }
  m.textContent = state.db && state.canWrite ? "decisions on" : state.db ? "view only" : "read-only";
  m.classList.toggle("live", !!(state.db && state.canWrite));
}
function findGroup(scope) {
  const [kind, ...rest] = scope.split(":");
  if (kind === "f") return D.findings.filter(f => f.code === rest[0]);
  const codes = new Set(rest.slice(1).join(":").split(","));
  return D.findings.filter(f => codes.has(f.code));
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-goto],[data-report],[data-back],[data-act],[data-copy],[data-ask],[data-uat],[data-day],[data-tag],[data-undo]");
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab, {report: null});
  if (t.dataset.goto) return go(t.dataset.goto, {report: null});
  if (t.dataset.report) return go("reports", {report: t.dataset.report});
  if (t.dataset.back) return go("reports", {report: null});
  if (t.dataset.tag) { state.q = t.dataset.tag; state.scope = "all"; return go("queue"); }
  if (t.dataset.day) { const el = document.getElementById("day-" + t.dataset.day); if (el) el.scrollIntoView({block: "start"}); return; }
  if (t.dataset.act) return decide(findGroup(t.dataset.scope), t.dataset.act);
  if (t.dataset.undo) return undo(t.dataset.undo);
  if (t.dataset.uat) return saveUat(t.dataset.name, t.dataset.uat);
  if (t.dataset.copy) { const f = D.findings.find(x => x.code === t.dataset.copy); try { navigator.clipboard.writeText(f.prompt).then(() => toast("Prompt copied"), () => toast("Copy isn't allowed here")); } catch (_) { toast("Copy isn't allowed here"); } return; }
  if (t.dataset.ask) {
    if (t.dataset.ask === "twenty") return ask("twenty", twentyPrompt());
    const fs = groups(D.findings.filter(f => f.check === t.dataset.check && (f.in_queue || state.scope !== "queue") && isOpen(f)));
    const g = fs.length ? fs[0][1] : D.findings.filter(f => f.check === t.dataset.check);
    return ask("g-" + t.dataset.check + "-" + t.dataset.ask, groupPrompt(t.dataset.ask, t.dataset.check, g));
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; queueList(); }
  if (e.target.id === "hq") { state.hq = e.target.value; healthList(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (["scope", "sort", "cat", "sev"].includes(id)) { state[id] = e.target.value; queueList(); }
  if (id === "hsort") { state.hsort = e.target.value; render.touched = true; healthList(); }
});

/* ---------- boot ---------- */
$("#asof").textContent = "data as of " + (D.generated || D.graded);
if (D.demo) {
  $("#mode").textContent = "demo · sample data";
  document.addEventListener("click", e => { const a = e.target.closest && e.target.closest('a[href="#demo"]'); if (a) { e.preventDefault(); toast("Demo: sample data, no real repo behind this link"); } }, true);
}
const h0 = (location.hash || "").slice(1);
if (h0) { const [tab, ...rep] = h0.split("-"); const known = TABS.some(([k]) => k === tab); if (known) { state.tab = tab; if (tab === "reports" && rep.length) state.report = rep.join("-"); } }
render();

(async () => {
  if (D.demo || !window.claude || typeof window.claude.use !== "function") return;   // the demo never touches a host
  const [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
  state.sample = sample;
  if (db) {
    state.db = db;
    let can = null;
    try { can = user && user.can ? await user.can("data.write") : null; } catch (_) {}
    state.canWrite = can !== false;
    const timer = setTimeout(() => toast("Saved decisions can't be reached yet."), 10000);
    db.collection("decisions").onSnapshot(s => {
      clearTimeout(timer);
      const m = {}; for (const d of s.docs) m[d.id] = d.data(); state.dec = m;
      if (!document.activeElement || !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) render(); else paintTabs();
    }, () => clearTimeout(timer));
    db.collection("uat").onSnapshot(s => {
      const m = {}; for (const d of s.docs) m[d.id] = d.data(); state.uat = m;
      if (state.tab === "sprint" && !(document.activeElement && document.activeElement.tagName === "TEXTAREA")) render();
    }, () => {});
  }
  setMode(); render();
})();
</script>
</body>
</html>
