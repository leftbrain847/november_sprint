<script>
(() => {

const fromCols = (a,b) => [a[0], b[0], a[1], b[1]];
const near = (a,b,tol = .06) => Math.abs(a[0]-b[0]) < tol && Math.abs(a[1]-b[1]) < tol;
const nearM = (A,B,tol = .06) => A.every((x,k) => Math.abs(x - B[k]) < tol);

function fmt(n, d = 1){ const p = Math.pow(10,d); let r = Math.round(n*p)/p; if (Object.is(r,-0) || Math.abs(r) < 1e-9) r = 0; return String(r).replace('-', '−'); }

  return {real:false, re:tr/2, im:Math.sqrt(-disc), rho:Math.sqrt(de)}; }
function svd2(A){ const [a,b,c,d] = A, p = a*a+c*c, q = a*b+c*d, r = b*b+d*d, th = .5*Math.atan2(2*q, p-r);
  const v1 = [Math.cos(th), Math.sin(th)], v2 = [-Math.sin(th), Math.cos(th)], s1 = len(mul(A,v1)), s2 = len(mul(A,v2));

function rgbOf(x, y, L){ L = L ?? (DARK ? .64 : .78); const a = .05*x, b = .05*y;
  const l_ = L + .3963377774*a + .2158037573*b, m_ = L - .1055613458*a - .0638541728*b, s_ = L - .0894841775*a - 1.291485548*b;
  const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;

function drawPlane(){

  if (key !== planeKey){ planeKey = key; const st = 3, w = Math.ceil(W/st), h = Math.ceil(H/st); planeCv.width = w; planeCv.height = h;
    const pc = planeCv.getContext('2d'), img = pc.createImageData(w, h);

// procedural photo: per-pixel lightness + opponent colour
const PW = 64, PH = 40, PHOTO = [];

    PHOTO.forEach((p, k) => { const q = mul(M, [p[1], p[2]]), c = rgbOf(q[0], q[1], p[0]); phImg.data.set([c[0], c[1], c[2], 255], k*4); });

// ---------- data (seeded, centred) ----------

{ const mx = DATA.reduce((s,p) => s + p[0], 0)/DATA.length, my = DATA.reduce((s,p) => s + p[1], 0)/DATA.length; DATA.forEach(p => { p[0] -= mx; p[1] -= my; }); }

const FIT = [[-3,-2.2],[-2.2,-1.1],[-1.4,-1.5],[-.6,.2],[.2,-.3],[1,1.2],[1.7,.8],[2.5,2.3],[3.2,1.9]];
const FIT_BEST = (() => { const n = FIT.length, mx = FIT.reduce((s,p) => s + p[0], 0)/n, my = FIT.reduce((s,p) => s + p[1], 0)/n;
  let sxy = 0, sxx = 0; FIT.forEach(([x,y]) => { sxy += (x-mx)*(y-my); sxx += (x-mx)*(x-mx); }); const m = sxy/sxx; return {m, c: my - m*mx}; })();
const fitErr = (m, c) => FIT.reduce((s,[x,y]) => s + Math.pow(y - (m*x + c), 2), 0);
const FIT_EMIN = fitErr(FIT_BEST.m, FIT_BEST.c), FX = 3.5;

// ---------- drawing ----------
const FS = () => W < 520 ? 14 : 17;
const font = (fs, w = 500) => `${w} ${fs}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
const P = (x,y) => [OX + x*S, OY - y*S];
const ext = () => Math.ceil((Math.max(W,H)/S)*0.75 + 3);

}
function axesOf(M, alpha = 1, color){
  const N = ext()*2; ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color || C.axis; ctx.lineWidth = 1.6; ctx.beginPath();

}
function edgeLabel(s, side){ ctx.save(); ctx.font = font(11, 700); ctx.fillStyle = C.fg; ctx.globalAlpha = .6; ctx.textBaseline = 'middle';

  if (side === 't'){ ctx.textAlign = 'left'; ctx.fillText('↑ ' + s, OX + 8, Math.max(14, 0) + (W < 520 ? 92 : 100)); }

  if (mode === 'try'){ if (!tryState[lv.id]) tryState[lv.id] = clone(Object.assign({}, lv.init, lv.tryInit || {})); const s = tryState[lv.id]; s._try = true; return s; }
  const s = Object.assign(clone(lv.init), lv.anim ? lv.anim(t) : {}); s._try = false; return s;
}
const htmlOf = s => parse(s).map(x => x.k ? `<b style="color:var(--${x.k === 'neg' ? 'j' : x.k === 'pos' ? 'i' : x.k})">${x.t}</b>` : x.t).join('');
function renderTabs(){ $('tabs').innerHTML = DEMOS.map((d, k) => { const ls = LV.filter(l => l.demo === k), n = ls.filter(l => done.has(l.id)).length;
  return `<button class="tab" data-d="${k}" aria-current="${LV[cur].demo === k}">${d}<small>${n}/${ls.length}</small></button>`; }).join('');
  $('count').textContent = `${[...done].filter(id => !id.includes('~')).length} / ${LV.length}`; }
function renderChips(){ const d = LV[cur].demo; $('chips').innerHTML = LV.map((l, k) => l.demo !== d ? '' :
  `<button class="chip${done.has(l.id) ? ' done' : ''}" data-k="${k}" aria-current="${k === cur}"><i></i>${l.name}</button>`).join('');
  const c = $('chips').querySelector('[aria-current="true"]'); if (c) c.scrollIntoView({block:'nearest', inline:'nearest'}); }
const curWorld = () => null;
function renderSay(){ const lv = LV[cur], story = TH === 'real' && lv.story, th = lv.themes.includes(TH) ? TH : 'math';
  $('say').textContent = story ? lv.story.say : TH === 'real' ? 'Stories so far:' : (th !== 'math' && lv.cap[th]) || lv.say;
  document.querySelectorAll('#themes button').forEach(b => { b.disabled = b.dataset.th === 'real' ? false : !lv.themes.includes(b.dataset.th); b.setAttribute('aria-pressed', b.dataset.th === TH); });
  const wb = $('worlds'); wb.hidden = !(TH === 'real' && !lv.story);
  wb.innerHTML = TH === 'real' && !lv.story ? LV.map((l, k) => l.story ? `<button data-go="${k}">${l.name} \u203a</button>` : '').join('') : ''; }
function renderGoal(ok){ const lv = EL(), g = $('goal');
  g.classList.toggle('ok', !!ok && mode === 'try');
  g.innerHTML = mode === 'watch' ? `<span class="ic"></span><span>${htmlOf(lv.goal.text)}</span><span class="go">Try ›</span>`
    : `<span class="ic">${ok ? '✓' : ''}</span><span>${htmlOf(lv.goal.text)}</span>${ok ? '<span class="go" style="color:var(--ok)">Next ›</span>' : ''}`;
  $('next').classList.toggle('pulse', !!ok && mode === 'try'); }
function renderSliders(){ const lv = EL(), box = $('sliders'); box.innerHTML = '';
  if (mode !== 'try' || !lv.sliders) return; const s = getState(lv);
  lv.sliders.forEach(sl => { const row = document.createElement('div'); row.className = 'sl'; const id = `sl-${lv.id}-${sl.p}`;
    row.innerHTML = `<label for="${id}" style="color:var(--${sl.key})">${sl.label || sl.p}</label><input type="range" id="${id}" min="${sl.min}" max="${sl.max}" step="${sl.step}" value="${s[sl.p]}" style="accent-color:var(--${sl.key})"><output>${(+s[sl.p]).toFixed(2)}</output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.addEventListener('input', () => { s[sl.p] = +inp.value; out.textContent = (+inp.value).toFixed(2); }); box.appendChild(row); }); }
function renderControls(){ const w = mode === 'watch';
  $('mWatch').setAttribute('aria-pressed', w); $('mTry').setAttribute('aria-pressed', !w);
  $('play').hidden = !w; $('scrub').hidden = !w; $('spacer').hidden = w; $('reset').hidden = w; setIcon(); }
function setIcon(){ $('playIcon').innerHTML = playing ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M8 5v14l11-7z"/>'; $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
function go(k, keepMode){
  cur = (k + LV.length) % LV.length; const lv = EL();
  if (!keepMode) mode = 'watch';
  t = (!playing || keepMode === 'rest') ? (lv.rest ?? lv.dur/2) : 0; lastOk = false;
  renderTabs(); renderChips(); renderSay(); renderGoal(false); renderSliders(); renderControls();
  cv.classList.remove('swap'); void cv.offsetWidth; cv.classList.add('swap');
  try { history.replaceState(null, '', '#' + LV[cur].id); } catch (e) {}
}
function setMode(m){ mode = m; lastOk = false; if (m === 'watch') t = 0; renderGoal(false); renderSliders(); renderControls(); }
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(LV.findIndex(l => l.demo === +b.dataset.d)); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.k); });
$('themes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const before = EL(); TH = b.dataset.th; renderSay(); if (EL() !== before){ lastOk = false; t = 0; renderGoal(false); renderSliders(); } });
$('worlds').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.go) go(+b.dataset.go); });
$('goal').addEventListener('click', () => { if (mode === 'watch') setMode('try'); else if (lastOk) go(cur + 1); });
$('mWatch').onclick = () => setMode('watch'); $('mTry').onclick = () => setMode('try');
$('play').onclick = () => { playing = !playing; setIcon(); };
$('reset').onclick = () => { delete tryState[EL().id]; lastOk = false; renderGoal(false); renderSliders(); };
$('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
$('scrub').addEventListener('input', () => { scrubbing = true; t = $('scrub').value/1000*EL().dur; });
$('scrub').addEventListener('change', () => { scrubbing = false; });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === ' ' && mode === 'watch'){ e.preventDefault(); playing = !playing; setIcon(); } });
const fromHash = () => { const k = LV.findIndex(l => '#' + l.id === location.hash); return k < 0 ? 0 : k; };
addEventListener('hashchange', () => { const k = fromHash(); if (k !== cur) go(k); });

// dragging
const toWorld = (px, py) => [(px - OX)/S, (OY - py)/S];
const snapV = p => p.map(x => { const h = Math.round(x*2)/2; return Math.abs(x - h) < .12 ? h : Math.round(x*10)/10; });
let drag = null;
cv.addEventListener('pointerdown', e => {
  const lv = EL(); if (mode !== 'try') return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left - MB.x, y = e.clientY - r.top - MB.y, s = getState(lv);
  let best = null, bd = 32; (lv.handles || []).forEach((h, k) => { const q = P(...h.get(s)), d = Math.hypot(q[0]-x, q[1]-y); if (d < bd){ bd = d; best = k; } });
  if (best !== null) drag = {k:best}; else if (lv.orbit) drag = {orbit:true, x, y, yaw:s.yaw, pitch:s.pitch};
  if (drag) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return; const lv = EL(), s = getState(lv), r = cv.getBoundingClientRect(), x = e.clientX - r.left - MB.x, y = e.clientY - r.top - MB.y;
  if (drag.orbit){ s.yaw = drag.yaw + (x - drag.x)*.01; s.pitch = clamp(drag.pitch + (y - drag.y)*.01, -.2, 1.4); return; }
  const raw = toWorld(x, y); lv.handles[drag.k].set(s, snapV(raw), raw);
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; const lv = EL();
  if (mode === 'watch' && playing && !scrubbing){ t += dt*(lv.id.includes('~') ? .6 : 1); if (t > lv.dur) t -= lv.dur; }
  if (mode === 'watch' && !scrubbing) $('scrub').value = Math.round(t/lv.dur*1000);
  const saveTH = TH, real = TH === 'real' && lv.worlds; if (!lv.themes.includes(TH)) TH = 'math';
  let mb = {x:0, y:0, w:CW, h:CH}, sb = null;
  if (real){ if (CH > CW*1.05){ const hm = Math.round(CH*.45); mb = {x:0, y:0, w:CW, h:hm}; sb = {x:0, y:hm, w:CW, h:CH - hm}; }
    else { const wm = Math.round(CW*.5); mb = {x:0, y:0, w:wm, h:CH}; sb = {x:wm, y:0, w:CW - wm, h:CH}; } }
  MB = mb; W = mb.w; H = mb.h;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle = C.panel; ctx.fillRect(0,0,CW,CH);
  ctx.save(); ctx.beginPath(); ctx.rect(mb.x, mb.y, mb.w, mb.h); ctx.clip(); ctx.translate(mb.x, mb.y);
  S = Math.min(W, H)/(2*(lv.range || 5)); OX = W/2 + (lv.ox || 0)*S; OY = H/2 - (lv.oy || 0)*S;
  try {
    const s = getState(lv), A = lv.M ? lv.M(s) : null;
    if (sb){ ctx.restore(); ctx.save(); ctx.beginPath(); ctx.rect(sb.x, sb.y, sb.w, sb.h); ctx.clip(); ctx.translate(sb.x, sb.y);
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, sb.w, sb.h); const wd = curWorld(lv); wd.draw(s, now, sb.w, sb.h, dt);
      ctx.restore(); ctx.save(); ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.beginPath(); if (sb.y){ ctx.moveTo(0, sb.y); ctx.lineTo(CW, sb.y); } else { ctx.moveTo(sb.x, 0); ctx.lineTo(sb.x, CH); } ctx.stroke(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.rect(mb.x, mb.y, mb.w, mb.h); ctx.clip(); ctx.translate(mb.x, mb.y); }
    if (!lv.custom) bg(A, lv);
    if (mode === 'try'){ if (lv.goal.ghost) lines(lv.goal.ghost, C.e, 1.3, ext(), .45, false, [5,5]); if (lv.goal.target) targetMark(lv.goal.target, now); }
    lv.draw(s, t, now);
    if (mode === 'try') (lv.handles || []).forEach(h => { const q = P(...h.get(s)); ctx.save(); ctx.fillStyle = C.panel; ctx.strokeStyle = C[h.key]; ctx.lineWidth = 3; ctx.globalAlpha = .95;
      ctx.beginPath(); ctx.arc(q[0], q[1], 11, 0, 6.2832); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(q[0], q[1], 3.5, 0, 6.2832); ctx.fillStyle = C[h.key]; ctx.fill(); ctx.restore(); });
    if (TH === 'color' && A) photo(A);
    if (mode === 'try'){ const ok = !!lv.goal.check(s); if (ok !== lastOk){ lastOk = ok; renderGoal(ok); if (ok && !done.has(lv.id)){ done.add(lv.id); saveDone(); renderTabs(); renderChips(); } } }
  } catch (err) { console.error(err); }
  ctx.restore(); TH = saveTH;
  requestAnimationFrame(frame);
}
go(fromHash(), 'rest'); requestAnimationFrame(frame);
})();
</script>
