<style>
:root {
  --bg: #f6f6f4;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #6b6a65;
  --line: #e4e3df;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --track: #ecebe7;
  --best: #2a78d6;
  --other: #a9a8a2;
  --warn-bg: #fff6e0;
  --warn-ink: #6b4b00;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #9a998f;
    --line: #2e2e2c;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --track: #2a2a28;
    --best: #3987e5;
    --other: #6b6a65;
    --warn-bg: #2d2615;
    --warn-ink: #f2d38a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a998f;
  --line: #2e2e2c; --accent: #3987e5; --accent-ink: #ffffff; --track: #2a2a28;
  --best: #3987e5; --other: #6b6a65; --warn-bg: #2d2615; --warn-ink: #f2d38a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 16px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.full { grid-column: 1 / -1; }
label, .lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
input, select {
  width: 100%;
  font-size: 16px; /* >=16px stops iOS zoom-on-focus */
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  -webkit-appearance: none; appearance: none;
  min-height: 44px;
}
.row2 { display: flex; gap: 6px; align-items: center; }
.row2 span { color: var(--ink-2); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 44px; }
.seg button {
  flex: 1; border: 0; background: var(--bg); color: var(--ink); font-size: 15px;
  padding: 0 10px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.yardrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.verdict { font-size: 24px; font-weight: 700; margin: 0; }
.verdict-sub { color: var(--ink-2); font-size: 14px; margin: 4px 0 0; }
.opt { padding: 12px 0; border-top: 1px solid var(--line); }
.opt:first-child { border-top: 0; padding-top: 0; }
.opt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.opt-name { font-weight: 600; }
.opt-wp { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--track); border-radius: 4px; margin: 6px 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--other); border-radius: 4px; }
.opt.best .bar > i { background: var(--best); }
.opt-detail { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.opt.na { color: var(--ink-3); }
.opt.na .opt-wp { font-size: 15px; font-weight: 500; }
.tag {
  display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px;
  background: var(--warn-bg); color: var(--warn-ink); vertical-align: 1px;
}
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 10px; }
details summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
details li { margin-bottom: 6px; }
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
</style>

        <div class="yardrow">
          <div class="seg" role="group" aria-label="Side of field">

// HEURISTIC WP for the team with the ball (see config heuristic.wp).
function wp(sd, yl, secs, spread) {
  const left = Math.max(secs, 0);
  const frac = left / R.game_seconds;
  const fracFloor = Math.max(left, H.wp.min_seconds) / R.game_seconds;
  return normCdf((sd + ep(yl) + spread * frac) / (H.wp.sigma * Math.sqrt(fracFloor)));
}
// Our WP when the opponent has the ball at their own yardline_100 `oppYl`.
const wpOppBall = (sd, oppYl, secs, spread) => 1 - wp(-sd, oppYl, secs, -spread);

const fmtPct = (p) => (p * PCT).toFixed(1) + "%";
const fmtEp = (x) => (x >= 0 ? "+" : "") + x.toFixed(2);
// Yard line from the offense's view: "your 30" = own 30, "their 8" = opponent's 8.
const fmtYl = (yl) => (yl === MID ? "midfield" : yl > MID ? "your " + (F - yl) : "their " + yl);

function evaluate(s) {
  const tc = H.time_costs_seconds, kick = R.kickoff_start_yardline_100;
  const opts = [];

  // GO: convert -> 1st down at the line to gain (TD if goal-to-go); fail -> opponent at the spot.
  {
    const row = convRow(s.togo), p = row.rate, t = s.secs - tc.go;
    const td = s.togo >= s.yl;
    const wS = td ? wpOppBall(s.sd + R.td_points, kick, t, s.spread) : wp(s.sd, s.yl - s.togo, t, s.spread);
    const eS = td ? R.td_points - ep(kick) : ep(s.yl - s.togo);
    const wF = wpOppBall(s.sd, F - s.yl, t, s.spread), eF = -ep(F - s.yl);
    opts.push({
      name: "Go for it", available: true,
      wp: p * wS + (1 - p) * wF, ep: p * eS + (1 - p) * eF,
      detail: "Convert " + fmtPct(p) + " (" + row.label + " to go" + (row.merged_3rd ? ", incl. 3rd downs" : "") +
        ") · " + (td ? "TD if converted" : "1st down at " + fmtYl(s.yl - s.togo)),
    });
  }

  // PUNT: touchback with the bucket's rate, otherwise the median non-touchback net.
  {
    const row = T.punt_table.find((r) => s.yl >= r.yardline_lo && s.yl <= r.yardline_hi);
    if (row) {
      const t = s.secs - tc.punt, tb = row.touchback_rate, tbYl = R.punt_touchback_yardline_100;
      const land = clamp(F - (s.yl - row.median_net_yards_non_touchback), YL_MIN, YL_MAX);
      opts.push({
        name: "Punt", available: true,
        wp: tb * wpOppBall(s.sd, tbYl, t, s.spread) + (1 - tb) * wpOppBall(s.sd, land, t, s.spread),
        ep: -(tb * ep(tbYl) + (1 - tb) * ep(land)),
        detail: "Net " + row.median_net_yards_non_touchback + " yds (median) · touchback " + fmtPct(tb) +
          " · they take over at " + fmtYl(F - land),
      });
    } else {
      const first = T.punt_table[0].yardline_lo;
      opts.push({ name: "Punt", available: false, detail: "No punt data closer than " + fmtYl(first) + " yard line" });
    }
  }

  // FIELD GOAL: logistic make probability; miss -> kick spot or the cap, whichever is better for them.
  {
    const dist = s.yl + R.fg_los_to_kick_distance;
    if (dist <= R.fg_max_attempt_distance) {
      const t = s.secs - tc.field_goal;
      const p = 1 / (1 + Math.exp(-(T.fg.a + T.fg.b * dist)));
      const missYl = Math.min(F - s.yl - R.fg_miss_spot_offset, R.fg_miss_max_yardline_100_for_opp);
      opts.push({
        name: "Field goal", available: true,
        wp: p * wpOppBall(s.sd + R.fg_points, kick, t, s.spread) + (1 - p) * wpOppBall(s.sd, missYl, t, s.spread),
        ep: p * (R.fg_points - ep(kick)) + (1 - p) * -ep(missYl),
        detail: dist + "-yd try · make " + fmtPct(p) + " · miss: they take over at " + fmtYl(F - missYl),
      });
    } else {
      opts.push({ name: "Field goal", available: false,
        detail: dist + "-yd try is beyond the " + R.fg_max_attempt_distance + "-yd limit" });
    }
  }
  return opts;
}

function verdict(opts) {
  const av = opts.filter((o) => o.available).sort((a, b) => b.wp - a.wp);
  const best = av[0], second = av[1];
  if (!second) return { best, text: best.name, sub: "Only available option" };
  const gap = (best.wp - second.wp) * PCT;
  const band = H.tossup.noise_band;
  const inBand = best.wp >= band[0] && best.wp <= band[1];
  const tossMax = inBand ? H.tossup.noise_band_tossup_max_wp_pts : H.tossup.tossup_max_wp_pts;
  const text = gap <= tossMax ? "Toss-up" : gap <= H.tossup.lean_max_wp_pts ? "Lean: " + best.name : best.name;
  return {
    best, text,
    sub: best.name + " by " + gap.toFixed(1) + " WP pts over " + second.name.toLowerCase() +
      " (toss-up ≤ " + tossMax + ", lean ≤ " + H.tossup.lean_max_wp_pts + " — heuristic)",
  };
}

let side = U.defaults.side;
const num = (id) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : 0; };

function readState() {
  const q = clamp(Math.round(num("qtr")), 1, U.quarters);
  const clock = clamp(num("min") * SEC_PER_MIN + num("sec"), 0, R.quarter_seconds);
  const yard = clamp(Math.round(num("yard")), 1, MID);
  const yl = clamp(side === "own" ? F - yard : yard, YL_MIN, YL_MAX);
  return {
    sd: num("own") - num("opp"),
    secs: (U.quarters - q) * R.quarter_seconds + clock,
    yl,
    togo: clamp(Math.round(num("togo")), 1, yl),
    spread: num("spread"),
  };
}

function render() {
  const opts = evaluate(readState());
  const v = verdict(opts);
  $("verdict").textContent = v.text;
  $("verdict-sub").textContent = v.sub;
  const box = $("options");
  box.replaceChildren();
  for (const o of opts) {
    const el = document.createElement("div");
    el.className = "opt" + (o.available ? "" : " na") + (o === v.best ? " best" : "");
    const head = document.createElement("div"); head.className = "opt-head";
    const nm = document.createElement("span"); nm.className = "opt-name"; nm.textContent = o.name;
    const w = document.createElement("span"); w.className = "opt-wp";
    w.textContent = o.available ? fmtPct(o.wp) : "n/a";
    head.append(nm, w); el.append(head);
    if (o.available) {
      const bar = document.createElement("div"); bar.className = "bar";
      const fill = document.createElement("i"); fill.style.width = (o.wp * PCT) + "%";
      bar.append(fill); el.append(bar);
    }
    const d = document.createElement("div"); d.className = "opt-detail";
    d.textContent = o.available ? "EP " + fmtEp(o.ep) + " · " + o.detail : o.detail;
    el.append(d); box.append(el);
  }
}

function li(html) { const e = document.createElement("li"); e.innerHTML = html; return e; }
const HTAG = ' <span class="tag">heuristic</span>';

function init() {
  const d = U.defaults, m = T.meta;
  $("sub").textContent = "Heuristic WP · nflverse data " + m.seasons[0] + "–" + m.seasons[1] +
    " · tables built " + m.build_date;
  for (let q = 1; q <= U.quarters; q++) {
    const o = document.createElement("option"); o.value = q; o.textContent = "Q" + q; $("qtr").append(o);
  }
  const attrs = {
    min: { min: 0, max: Math.floor(R.quarter_seconds / SEC_PER_MIN) },
    sec: { min: 0, max: SEC_PER_MIN - 1 },
    yard: { min: 1, max: MID },
    togo: { min: 1, max: YL_MAX },
    spread: { step: d.spread_step },
  };
  for (const [id, a] of Object.entries(attrs)) for (const [k, val] of Object.entries(a)) $(id).setAttribute(k, val);
  $("own").value = d.own_score; $("opp").value = d.opp_score; $("qtr").value = d.quarter;
  $("min").value = d.clock_minutes; $("sec").value = String(d.clock_seconds).padStart(2, "0");
  $("yard").value = d.yard; $("togo").value = d.ydstogo; $("spread").value = d.posteam_spread;

  const setSide = (sd) => {
    side = sd;
    for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.side === sd));
    render();
  };
  for (const b of document.querySelectorAll(".seg button")) b.addEventListener("click", () => setSide(b.dataset.side));
  for (const id of ["own", "opp", "qtr", "min", "sec", "yard", "togo", "spread"]) {
    $(id).addEventListener("input", render);
    $(id).addEventListener("change", render);
  }

  const tc = H.time_costs_seconds, merged = T.conv_table.filter((r) => r.merged_3rd).map((r) => r.label);
  const ul = $("assumptions");
  ul.append(
    li("Win probability = Φ((score diff + EP + spread × time left) / (σ × √time left)), " +
       "σ = " + H.wp.sigma + " pts per game, time floor " + H.wp.min_seconds + " s." + HTAG),
    li("Toss-up if the gap ≤ " + H.tossup.tossup_max_wp_pts + " WP pts (≤ " +
       H.tossup.noise_band_tossup_max_wp_pts + " when the best WP is " + fmtPct(H.tossup.noise_band[0]) + "–" +
       fmtPct(H.tossup.noise_band[1]) + "); lean ≤ " + H.tossup.lean_max_wp_pts + "." + HTAG),
    li("Clock used: go " + tc.go + " s, punt " + tc.punt + " s, field goal " + tc.field_goal + " s." + HTAG),
    li("EP: mean nflverse EP on 1st & 10 by yard line, rolling mean (" + m.row_counts.ep_table.toLocaleString() + " plays)."),
    li("Conversion: 4th-down run/pass success by yards to go (" + m.row_counts.conv_table_4th.toLocaleString() +
       " attempts); 3rd downs merged into sparse buckets: " + (merged.length ? merged.join(", ") : "none") +
       ". A converted play gains exactly the line to gain."),
    li("Field goal: logistic fit on " + T.fg.n.toLocaleString() + " attempts (blocked = miss); kick distance = yard line + " +
       R.fg_los_to_kick_distance + "."),
    li("Punt: median net yards and touchback rate by " + (T.punt_table[0].yardline_hi - T.punt_table[0].yardline_lo + 1) +
       "-yard bucket (" + m.row_counts.punt_table.toLocaleString() + " punts); touchback puts the ball at " +
       fmtYl(F - R.punt_touchback_yardline_100) + ". Blocks, muffs and penalties ignored."),
    li("After a score the opponent starts at " + fmtYl(F - R.kickoff_start_yardline_100) + " (" + R.season +
       " kickoff rules); TD = " + R.td_points + " pts incl. PAT."),
    li("Not modelled: timeouts, end-of-game kneel-outs, team or kicker strength. Late in close games this WP is unreliable."),
  );
  setSide(side);
}
init();
</script>
</body>
</html>
